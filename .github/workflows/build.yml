name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '源码分支或 Tag（例如 dev、main、v4.2.0）'
        required: false
        default: 'dev'
      version:
        description: '发布版本号（如 4.3.0）；留空则发布 nightly，新的 nightly 会覆盖旧的'
        required: false
        default: ''
      publish_release:
        description: '是否创建/更新 GitHub Release（关闭则只上传 Actions 产物）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/app/release-key.jks"
          echo "KEYSTORE_FILE=${{ github.workspace }}/app/release-key.jks" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 一次构建同时生成普通 release 与带 R8 的 r8 构建（均包含 Universal 与 ABI 拆分包）
      - name: Build Release APKs (Universal & Splits, with and without R8)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleR8 --stacktrace

      # 不带 R8 的 Universal 包（app/build/outputs/apk/release/app-universal-release.apk）
      - name: Upload Universal APK (without R8)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-universal
          path: app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error

      # 带 R8 的 Universal 包（app/build/outputs/apk/r8/app-universal-r8.apk）
      - name: Upload Universal APK (with R8)
        uses: actions/upload-artifact@v4
        with:
          name: app-r8-universal
          path: app/build/outputs/apk/r8/app-universal-r8.apk
          if-no-files-found: error

      - name: Prepare release metadata & notes
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          VERSION="$(echo "$INPUT_VERSION" | xargs)"
          if [ -z "$VERSION" ]; then
            SUFFIX="nightly"
            IS_NIGHTLY="true"
            TAG="nightly"
            NAME="Nightly"
          else
            SUFFIX="$VERSION"
            IS_NIGHTLY="false"
            TAG="$VERSION"
            case "$TAG" in
              v*) ;;
              *) TAG="v$TAG" ;;
            esac
            NAME="$VERSION"
          fi
          {
            echo "is_nightly=$IS_NIGHTLY"
            echo "tag=$TAG"
            echo "name=$NAME"
            echo "apk_suffix=$SUFFIX"
          } >> "$GITHUB_OUTPUT"

          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-universal-release.apk \
             "release-assets/VariableFontTest-$SUFFIX-universal.apk"
          cp app/build/outputs/apk/r8/app-universal-r8.apk \
             "release-assets/VariableFontTest-$SUFFIX-universal-r8.apk"
          ( cd release-assets && sha256sum *.apk > SHA256SUMS.txt )
          ls -lh release-assets

          # Release notes: English, always starting with the warning alert
          cat > release-notes.md <<'WARNING_EOF'
          > [!WARNING]
          > This release uses a different package name suffix `_n` and application name suffix `N` to distinguish it from the original.
          >
          > Since I used a public signature, you must check the SHA256 of the apk file before using it.
          WARNING_EOF

          printf '\n' >> release-notes.md
          if [ "$IS_NIGHTLY" = "true" ]; then
            printf 'Automated nightly build from branch/tag `%s` (commit `%s`).\n\n' "$INPUT_REF" "$GITHUB_SHA" >> release-notes.md
          else
            printf 'Release `%s`, built from branch/tag `%s` (commit `%s`).\n\n' "$VERSION" "$INPUT_REF" "$GITHUB_SHA" >> release-notes.md
          fi
          printf '### Assets\n\n' >> release-notes.md
          printf -- '- `%s` — universal APK without R8\n' "VariableFontTest-$SUFFIX-universal.apk" >> release-notes.md
          printf -- '- `%s` — universal APK with R8 (smaller)\n' "VariableFontTest-$SUFFIX-universal-r8.apk" >> release-notes.md
          printf -- '- `SHA256SUMS.txt` — SHA256 checksums of the APKs\n\n' >> release-notes.md
          printf 'Workflow run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          if [ "$IS_NIGHTLY" = "true" ]; then
            printf '\n> This is a rolling nightly release; every new nightly build replaces this one.\n' >> release-notes.md
          fi
          cat release-notes.md

      - name: Delete previous nightly release
        if: ${{ inputs.publish_release && steps.meta.outputs.is_nightly == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true

      - name: Publish versioned Release
        if: ${{ inputs.publish_release && steps.meta.outputs.is_nightly != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: release-assets/*

      - name: Publish nightly Release
        if: ${{ inputs.publish_release && steps.meta.outputs.is_nightly == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: release-assets/*
