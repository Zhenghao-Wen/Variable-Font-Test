name: Build Release APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/app/release-key.jks
          echo "KEYSTORE_FILE=${{ github.workspace }}/app/release-key.jks" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 一次构建即生成 Universal 和所有 ABI 拆分包
      - name: Build Release APKs (Universal & Splits)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # 上传 Universal 包（文件名为 app-universal-release.apk）
      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-universal
          path: app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error

      # 上传 arm64-v8a 专用包（文件名为 app-arm64-v8a-release.apk）
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-arm64-v8a
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error