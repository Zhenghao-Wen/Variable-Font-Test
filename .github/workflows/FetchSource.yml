name: Build Debug Measurement APK (com.vftest)

on:
  workflow_dispatch:
  push:
    branches:
      - QwenMirror

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 仅改 applicationId 实现共存；namespace 保持不变以保留 Fragment/类引用 ──
      - name: Repackage to com.vftest (applicationId only)
        run: |
          sed -i 's/applicationId = "moe.echo.variablefonttest_n"/applicationId = "com.vftest"/' app/build.gradle.kts
          echo "=== applicationId / namespace after change ==="
          grep -nE "applicationId|namespace" app/build.gradle.kts

      # ── 修改应用标签，便于在设备上与正式版区分 ──
      - name: Set distinct debug label
        run: |
          sed -i 's/android:label="@string\/app_name"/android:label="VFT-Debug"/' app/src/main/AndroidManifest.xml
          grep -n "android:label" app/src/main/AndroidManifest.xml

      # ── 注入 MEASURE 测量埋点（SliderPreference + SeekBarPreference）──
      - name: Inject MEASURE instrumentation
        run: |
          python3 << 'PYEOF'
          import io

          def inject(path, anchor, block):
              with io.open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              idx = None
              for i, line in enumerate(lines):
                  if anchor in line:
                      idx = i
                      break
              if idx is None:
                  raise SystemExit("ERROR: anchor '%s' not found in %s" % (anchor, path))
              lines.insert(idx + 1, block)
              with io.open(path, "w", encoding="utf-8") as f:
                  f.writelines(lines)
              print("OK: injected after line %d in %s" % (idx + 1, path))

          slider_block = '''        // == MEASURE 埋点（CI 自动注入，仅用于本次测量构建）==
          run {
              val density = s.resources.displayMetrics.density
              android.util.Log.d("MEASURE", "[MD3] Slider paddingLeft=${"%.2f".format(s.paddingLeft / density)}dp, paddingRight=${"%.2f".format(s.paddingRight / density)}dp")
              vt?.let { tv ->
                  tv.fontFeatureSettings = "tnum"
                  android.util.Log.d("MEASURE", "[MD3] '1000'(tnum)width=${"%.2f".format(tv.paint.measureText("1000") / density)}dp, single '0'(tnum)width=${"%.2f".format(tv.paint.measureText("0") / density)}dp")
                  tv.post {
                      android.util.Log.d("MEASURE", "[MD3] slider_value viewWidth=${"%.2f".format(tv.width / density)}dp, paddingH=${"%.2f".format((tv.paddingStart + tv.paddingEnd) / density)}dp, effectiveTextWidth=${"%.2f".format((tv.width - tv.paddingStart - tv.paddingEnd) / density)}dp")
                  }
              }
          }
          // == MEASURE end ==
          '''

          seekbar_block = '''        // == MEASURE 埋点（CI 自动注入，仅用于本次测量构建）==
          run {
              val density = seekBar.resources.displayMetrics.density
              android.util.Log.d("MEASURE", "[MD2] SeekBar paddingLeft=${"%.2f".format(seekBar.paddingLeft / density)}dp, paddingRight=${"%.2f".format(seekBar.paddingRight / density)}dp")
              (view.findViewById(androidx.preference.R.id.seekbar_value) as? android.widget.TextView)?.let { tv ->
                  tv.fontFeatureSettings = "tnum"
                  android.util.Log.d("MEASURE", "[MD2] '1000'(tnum)width=${"%.2f".format(tv.paint.measureText("1000") / density)}dp, single '0'(tnum)width=${"%.2f".format(tv.paint.measureText("0") / density)}dp")
                  tv.post {
                      android.util.Log.d("MEASURE", "[MD2] seekbar_value viewWidth=${"%.2f".format(tv.width / density)}dp, paddingH=${"%.2f".format((tv.paddingStart + tv.paddingEnd) / density)}dp, effectiveTextWidth=${"%.2f".format((tv.width - tv.paddingStart - tv.paddingEnd) / density)}dp")
                  }
              }
          }
          // == MEASURE end ==
          '''

          inject(
              "app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt",
              "findViewById(R.id.slider_value)",
              slider_block,
          )
          inject(
              "app/src/main/java/moe/echo/variablefonttest_n/SeekBarPreference.kt",
              "thumbTintList = primaryColorStateList",
              seekbar_block,
          )
          PYEOF

      - name: Verify injection
        run: |
          echo "=== SliderPreference MEASURE lines ==="
          grep -c "MEASURE" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt
          echo "=== SeekBarPreference MEASURE lines ==="
          grep -c "MEASURE" app/src/main/java/moe/echo/variablefonttest_n/SeekBarPreference.kt
          echo "=== injected region (Slider) ==="
          grep -n -A2 "MEASURE 埋点" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt | head -6

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug --no-daemon

      - name: Locate APK
        run: |
          ls -la app/build/outputs/apk/debug/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vftest-debug-measure
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14