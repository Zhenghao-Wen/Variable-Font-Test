name: Verify All Color References Resolve

on:
  workflow_dispatch:
  push:
    branches:
      - QwenMirror

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Check every @color reference is defined
        run: |
          set -euo pipefail
          cd app/src/main/res

          # 所有已定义的颜色资源名（<color name="X">，含各限定符目录）
          defs=$(grep -rhoE '<color name="[a-zA-Z0-9_]+"' . \
                 | sed -E 's/<color name="([^"]+)"/\1/' | sort -u)

          # 所有被引用的 @color/X（排除系统 @android:color/...）
          refs=$(grep -rhoE '@color/[a-zA-Z0-9_]+' . \
                 | sed -E 's#@color/##' | sort -u)

          echo "=== 被引用但未定义的颜色（应为空）==="
          missing=$(comm -23 <(echo "$refs") <(echo "$defs") || true)
          if [ -n "$missing" ]; then
            echo "$missing"
            echo "RESULT: FAIL —— 以上颜色缺定义，需补回 values/colors.xml"
            exit 1
          else
            echo "（无）"
            echo "RESULT: PASS —— 所有 @color 引用均有定义"
          fi

      - name: Build debug
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug