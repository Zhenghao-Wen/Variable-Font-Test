name: Debug Build - Slider Alignment Final (delta=4dp) v2

on:
  workflow_dispatch:
  push:
    branches:
      - QwenMirror

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repackage to com.vftest
        run: |
          set -euo pipefail
          sed -i 's/applicationId = "moe.echo.variablefonttest_n"/applicationId = "com.vftest"/' app/build.gradle.kts || {
            echo "ERROR: applicationId replacement failed" >&2
            exit 1
          }
          sed -i 's/android:label="@string\/app_name"/android:label="VFT-Debug"/' app/src/main/AndroidManifest.xml || {
            echo "ERROR: android:label replacement failed" >&2
            exit 1
          }

      - name: Write injection script
        run: |
          cat > inject_final.py << 'PYSCRIPT'
          import io, sys

          path = "app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt"
          try:
              with io.open(path, "r", encoding="utf-8") as f:
                  src = f.read()
          except IOError as e:
              print("ERROR reading file:", e, file=sys.stderr)
              sys.exit(1)

          def repl(old, new, label):
              global src
              if old not in src:
                  print("ERROR [" + label + "] not found: " + repr(old[:90]), file=sys.stderr)
                  sys.exit(1)
              src = src.replace(old, new, 1)
              print("OK [" + label + "]")

          # (1) δ: 1dp -> 4dp
          repl(
              "const val TRACK_END_INSET_DP = 1f",
              "const val TRACK_END_INSET_DP = 4f",
              "delta 1->4",
          )

          # (2) 补偿块内现算数值区宽度 W（dev 上没有，需注入；幂等）
          if "val valueTextWidth = valueText?.let" not in src:
              repl(
                  "val delta = (TRACK_END_INSET_DP * s.resources.displayMetrics.density).toInt()",
                  "val delta = (TRACK_END_INSET_DP * s.resources.displayMetrics.density).toInt()\n"
                  "                val valueTextWidth = valueText?.let { tv -> (tv.paint.measureText(\"1000\") + (tv.paddingStart + tv.paddingEnd) + 2 * s.resources.displayMetrics.density).toInt() } ?: 0",
                  "compute W",
              )
          else:
              print("SKIP [compute W already present]")

          # (3) ★关键修正★ 匹配 dev 上的真实旧公式，替换为定稿公式
          #     旧(dev): if (showLabel) -inset else -(inset + delta)
          #     新(定稿): if (showLabel) -(inset + delta) else (valueTextWidth - inset)
          repl(
              "lp.marginEnd = if (showLabel) -inset else -(inset + delta)",
              "lp.marginEnd = if (showLabel) -(inset + delta) else (valueTextWidth - inset)",
              "FINAL marginEnd",
          )

          # (4) 跟踪日志（幂等）
          if "SLIDER_GAP" not in src:
              repl(
                  "                    s.layoutParams = lp",
                  "                    s.layoutParams = lp\n"
                  "                    android.util.Log.d(\"SLIDER_GAP\", \"showLabel=\" + showLabel"
                  " + \" insetDp=\" + (inset / s.resources.displayMetrics.density)"
                  " + \" Wdp=\" + (valueTextWidth / s.resources.displayMetrics.density)"
                  " + \" deltaDp=\" + (delta / s.resources.displayMetrics.density)"
                  " + \" mStartPx=\" + lp.marginStart"
                  " + \" mEndPx=\" + lp.marginEnd"
                  " + \" gapRightDp=\" + ((lp.marginEnd + inset) / s.resources.displayMetrics.density))",
                  "tracking log",
              )
          else:
              print("SKIP [tracking log already present]")

          try:
              with io.open(path, "w", encoding="utf-8") as f:
                  f.write(src)
          except IOError as e:
              print("ERROR writing file:", e, file=sys.stderr)
              sys.exit(1)

          print("DONE: final alignment injected")
          PYSCRIPT
          echo "inject_final.py written"

      - name: Run injection
        run: python3 inject_final.py

      - name: Verify injection
        run: |
          set -euo pipefail
          echo "=== delta=4 ==="
          grep -n "TRACK_END_INSET_DP = 4f" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "(not found)"
          echo "=== FINAL marginEnd formula ==="
          grep -n "if (showLabel) -(inset + delta) else (valueTextWidth - inset)" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "(not found)"
          echo "=== old formula gone (expect 0) ==="
          grep -c "else -(inset + delta)" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "0"

      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vftest-align-final-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14