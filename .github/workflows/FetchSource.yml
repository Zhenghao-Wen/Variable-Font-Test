name: Debug Build - Slider Alignment (8dp)

on:
  workflow_dispatch:
  push:
    branches:
      - QwenMirror

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repackage to com.vftest
        run: |
          set -euo pipefail
          sed -i 's/applicationId = "moe.echo.variablefonttest_n"/applicationId = "com.vftest"/' app/build.gradle.kts || {
            echo "ERROR: applicationId replacement failed" >&2
            exit 1
          }
          sed -i 's/android:label="@string\/app_name"/android:label="VFT-Debug"/' app/src/main/AndroidManifest.xml || {
            echo "ERROR: android:label replacement failed" >&2
            exit 1
          }

      - name: Write injection script
        run: |
          cat > inject_align.py << 'PYSCRIPT'
          import io, sys

          path = "app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt"
          try:
              with io.open(path, "r", encoding="utf-8") as f:
                  src = f.read()
          except IOError as e:
              print("ERROR reading file:", e, file=sys.stderr)
              sys.exit(1)

          def repl(old, new, label):
              global src
              if old not in src:
                  print("ERROR [" + label + "] not found: " + repr(old[:80]), file=sys.stderr)
                  sys.exit(1)
              src = src.replace(old, new, 1)
              print("OK [" + label + "]")

          # (1) 常量：换成三个语义独立的位移量
          repl(
              "const val TRACK_END_INSET_DP = 1f",
              "const val LEFT_SHIFT_DP = 4f\n"
              "        const val WGHT_ASSEMBLY_SHIFT_DP = 8f\n"
              "        const val OTHER_RIGHT_SHIFT_DP = 8f",
              "constants",
          )

          # (2) wght 数值文字 marginEnd：整组左移（在 .apply{} 内，this=layoutParams）
          repl(
              'width = (tv.paint.measureText("1000") + paddingH + 2 * density).toInt()',
              'width = (tv.paint.measureText("1000") + paddingH + 2 * density).toInt()\n'
              '                if (showLabel) (this as? android.view.ViewGroup.MarginLayoutParams)?.marginEnd = (WGHT_ASSEMBLY_SHIFT_DP * density).toInt()',
              "value text marginEnd",
          )

          # (3) 补偿块：density + 位移 + valueTextWidth
          repl(
              "val delta = (TRACK_END_INSET_DP * s.resources.displayMetrics.density).toInt()",
              "val density = s.resources.displayMetrics.density\n"
              "                val leftShiftPx = (LEFT_SHIFT_DP * density).toInt()\n"
              "                val otherRightShiftPx = (OTHER_RIGHT_SHIFT_DP * density).toInt()\n"
              "                val valueTextWidth = valueText?.let { tv -> (tv.paint.measureText(\"1000\") + (tv.paddingStart + tv.paddingEnd) + 2 * density).toInt() } ?: 0",
              "compensation vars",
          )

          # (4) marginStart：左端保持 4dp 右移
          repl(
              "lp.marginStart = -(inset - delta)",
              "lp.marginStart = -(inset - leftShiftPx)",
              "marginStart",
          )

          # (5) marginEnd：wght=-inset(贴合不侵入)；非wght=留距W-8dp
          repl(
              "lp.marginEnd = if (showLabel) -inset else -(inset + delta)",
              "lp.marginEnd = if (showLabel) -inset else (valueTextWidth - otherRightShiftPx - inset)",
              "marginEnd",
          )

          # (6) 轻量日志（便于核对，可删）
          repl(
              "s.layoutParams = lp",
              "s.layoutParams = lp\n"
              "                    android.util.Log.d(\"SLIDER_ALIGN\", \"showLabel=\" + showLabel"
              " + \" mStartPx=\" + lp.marginStart + \" mEndPx=\" + lp.marginEnd)",
              "log",
          )

          try:
              with io.open(path, "w", encoding="utf-8") as f:
                  f.write(src)
          except IOError as e:
              print("ERROR writing file:", e, file=sys.stderr)
              sys.exit(1)

          print("DONE: alignment injected")
          PYSCRIPT

      - name: Run injection
        run: python3 inject_align.py

      - name: Verify
        run: |
          set -euo pipefail
          echo "=== new constants ==="
          grep -nE "LEFT_SHIFT_DP|WGHT_ASSEMBLY_SHIFT_DP|OTHER_RIGHT_SHIFT_DP" \
            app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt | head -6 || echo "(none)"
          echo "=== value text marginEnd ==="
          grep -n "WGHT_ASSEMBLY_SHIFT_DP \* density" \
            app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "(none)"
          echo "=== final marginEnd ==="
          grep -n "valueTextWidth - otherRightShiftPx - inset" \
            app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "(none)"
          echo "=== no leftover TRACK_END_INSET_DP / delta (expect 0) ==="
          grep -cE "TRACK_END_INSET_DP|- \(inset \+ delta\)" \
            app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "0 (good)"

      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew app:assembleDebug --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vftest-align-8dp
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14