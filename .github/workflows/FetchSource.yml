name: Investigate FontFamily Dialog RadioButton Color

on:
  workflow_dispatch:
  push:
    branches:
      - QwenMirror

jobs:
  investigate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Build report
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "❌ Error at line $LINENO (exit code $?)" >&2' ERR

          R="radiobutton_investigation.txt"
          RES="app/src/main/res"
          JAVA="app/src/main/java"
          OF="$JAVA/moe/echo/variablefonttest_n/OptionsFragment.kt"

          # 安全读取文件
          safe_cat() {
            if [ -f "$1" ]; then
              cat "$1"
            else
              echo "[FILE NOT FOUND] $1"
            fi
          }

          # 安全执行 awk（若文件不存在或模式不匹配则输出提示）
          safe_awk_range() {
            local file="$1" pattern="$2"
            if [ ! -f "$file" ]; then
              echo "[FILE NOT FOUND] $file"
              return 0
            fi
            awk "$pattern" "$file" 2>/dev/null || echo "(awk pattern no match or error)"
          }

          {
            echo "# FontFamily Dialog RadioButton Color Investigation"
            echo "# Branch: dev"
            echo "# Commit: $(git rev-parse HEAD)"
            echo "# Date: $(date -u)"
            echo ""

            # ═══ A. 主题链路 ═══
            echo "## [A1] values/themes.xml"
            echo '```xml'
            safe_cat "$RES/values/themes.xml"
            echo '```'
            echo ""
            echo "## [A2] values-night/themes.xml"
            echo '```xml'
            safe_cat "$RES/values-night/themes.xml"
            echo '```'
            echo ""

            # ═══ B. Dialog 构建代码 ═══
            echo "## [B1] OptionsFragment — onDisplayPreferenceDialog / showMd3ListDialog / showMd3EditTextDialog"
            echo '```kotlin'
            safe_awk_range "$OF" '/override fun onDisplayPreferenceDialog/,/^    }$/'
            echo '```'
            echo ""
            echo "## [B2] OptionsFragment — 所有 MaterialAlertDialogBuilder 构造处"
            echo '```kotlin'
            grep -nE "MaterialAlertDialogBuilder" "$OF" 2>/dev/null || echo "(no matches)"
            echo '```'
            echo ""

            # ═══ C. 全局检索主题/取色关键字 ═══
            echo "## [C1] res/ 中 dialog/radio/取色 关键字命中"
            echo '```'
            grep -rniE "materialAlertDialogTheme|alertDialogTheme|dialogTheme|colorControlActivated|colorAccent|radioButtonStyle|listChoiceIndicator|colorControlNormal" "$RES" 2>/dev/null || echo "(no match)"
            echo '```'
            echo ""
            echo "## [C2] res/ 中 colorPrimary / colorSecondary 自定义命中"
            echo '```'
            grep -rniE "name=\"colorPrimary\"|name=\"colorSecondary\"|name=\"colorControlActivated\"|name=\"colorAccent\"" "$RES" 2>/dev/null || echo "(no custom colorPrimary/colorSecondary/colorControlActivated/colorAccent defined)"
            echo '```'
            echo ""

            # ═══ D. 颜色资源（确认 Primary/Secondary 取值）═══
            echo "## [D] 各 colors.xml 全文"
            for f in $(find "$RES" -name "colors.xml" | sort); do
              echo "### $f"
              echo '```xml'
              safe_cat "$f"
              echo '```'
              echo ""
            done

            # ═══ E. 动态取色入口 ═══
            echo "## [E] MainActivity.kt — DynamicColors"
            echo '```kotlin'
            grep -nE "DynamicColors|applyToActivityIfAvailable" "$JAVA/moe/echo/variablefonttest_n/MainActivity.kt" 2>/dev/null || echo "(no DynamicColors)"
            echo '```'
            echo ""

            # ═══ F. 库版本 ═══
            echo "## [F] gradle/libs.versions.toml（material / preference 版本）"
            echo '```toml'
            grep -iE "material|preference|googleMaterial" gradle/libs.versions.toml 2>/dev/null || echo "(no version info)"
            echo '```'
            echo ""

            # ═══ G. 是否存在自定义 dialog/radio 样式文件 ═══
            echo "## [G] res/values 下所有 style 定义（检索 dialog/radio/alert 相关）"
            echo '```'
            grep -rniE "<style .*(dialog|radio|alert)" "$RES" 2>/dev/null || echo "(no custom dialog/radio/alert style)"
            echo '```'
          } > "$R"

          echo "Report size: $(wc -c < "$R") bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: radiobutton-investigation
          path: radiobutton_investigation.txt
          retention-days: 14