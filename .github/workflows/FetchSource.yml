name: Debug Build - Slider Alignment Tuned

on:
  workflow_dispatch:
  push:
    branches:
      - QwenMirror

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repackage to com.vftest
        run: |
          set -euo pipefail
          sed -i 's/applicationId = "moe.echo.variablefonttest_n"/applicationId = "com.vftest"/' app/build.gradle.kts || {
            echo "ERROR: applicationId replacement failed" >&2
            exit 1
          }
          sed -i 's/android:label="@string\/app_name"/android:label="VFT-Debug"/' app/src/main/AndroidManifest.xml || {
            echo "ERROR: android:label replacement failed" >&2
            exit 1
          }

      - name: Write injection script
        run: |
          cat > inject_tuned.py << 'PYSCRIPT'
          import io, sys, re

          path = "app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt"
          try:
              with io.open(path, "r", encoding="utf-8") as f:
                  src = f.read()
          except IOError as e:
              print("ERROR reading file:", e, file=sys.stderr)
              sys.exit(1)

          def repl(old, new, label):
              global src
              if old not in src:
                  print("ERROR [" + label + "] not found: " + repr(old[:90]), file=sys.stderr)
                  sys.exit(1)
              src = src.replace(old, new, 1)
              print("OK [" + label + "]")

          # (1) 常量：单一 δ 换成三个语义常量（兼容 dev 上仍是 1f 或已被改过的情况）
          src = re.sub(
              r"const val TRACK_END_INSET_DP = [0-9.]+f",
              "const val LEFT_SHIFT_DP = 6f\n"
              "        const val ASSEMBLY_SHIFT_DP = 8f\n"
              "        const val GAP_TRIM_DP = -8f",
              src, count=1)
          if "LEFT_SHIFT_DP" not in src:
              print("ERROR [constants] replace failed", file=sys.stderr)
              sys.exit(1)
          print("OK [constants]")

          # (2) 数值区 TextView：wght 时加 marginEnd 把整组左移（治"偏右"）
          repl(
              "width = (tv.paint.measureText(\"1000\") + paddingH + 2 * density).toInt()",
              "width = (tv.paint.measureText(\"1000\") + paddingH + 2 * density).toInt()\n"
              "                if (showLabel) (this as? android.view.ViewGroup.MarginLayoutParams)?.marginEnd = (ASSEMBLY_SHIFT_DP * density).toInt()",
              "value text marginEnd",
          )

          # (3) 补偿块：delta 行换成三常量 + 现算 W
          repl(
              "val delta = (TRACK_END_INSET_DP * s.resources.displayMetrics.density).toInt()",
              "val density = s.resources.displayMetrics.density\n"
              "                val leftShiftPx = (LEFT_SHIFT_DP * density).toInt()\n"
              "                val gapTrimPx = (GAP_TRIM_DP * density).toInt()\n"
              "                val valueTextWidth = valueText?.let { tv -> (tv.paint.measureText(\"1000\") + (tv.paddingStart + tv.paddingEnd) + 2 * density).toInt() } ?: 0",
              "compensation vars",
          )

          # (4) marginStart：用 leftShiftPx
          repl(
              "lp.marginStart = -(inset - delta)",
              "lp.marginStart = -(inset - leftShiftPx)",
              "marginStart",
          )

          # (5) marginEnd 定稿：wght=-inset(不顶入)；非wght=(W-trim)-inset
          #     兼容 dev 原始公式 与 已被改过的中间态
          for candidate in [
              "lp.marginEnd = if (showLabel) -inset else -(inset + delta)",
              "lp.marginEnd = if (showLabel) -(inset + delta) else (valueTextWidth - inset)",
              "lp.marginEnd = if (showLabel) -inset else (valueTextWidth + delta - inset)",
          ]:
              if candidate in src:
                  repl(
                      candidate,
                      "lp.marginEnd = if (showLabel) -inset else (valueTextWidth - gapTrimPx - inset)",
                      "marginEnd FINAL",
                  )
                  break
          else:
              print("ERROR [marginEnd FINAL] no known formula matched", file=sys.stderr)
              sys.exit(1)

          # (6) 跟踪日志（幂等）
          if "SLIDER_GAP" not in src:
              repl(
                  "                    s.layoutParams = lp",
                  "                    s.layoutParams = lp\n"
                  "                    android.util.Log.d(\"SLIDER_GAP\", \"showLabel=\" + showLabel"
                  " + \" insetDp=\" + (inset / density)"
                  " + \" Wdp=\" + (valueTextWidth / density)"
                  " + \" leftShiftDp=\" + LEFT_SHIFT_DP"
                  " + \" gapTrimDp=\" + GAP_TRIM_DP"
                  " + \" mStartPx=\" + lp.marginStart"
                  " + \" mEndPx=\" + lp.marginEnd"
                  " + \" gapRightDp=\" + ((lp.marginEnd + inset) / density))",
                  "tracking log",
              )
          else:
              print("SKIP [tracking log present]")

          try:
              with io.open(path, "w", encoding="utf-8") as f:
                  f.write(src)
          except IOError as e:
              print("ERROR writing file:", e, file=sys.stderr)
              sys.exit(1)

          print("DONE: tuned alignment injected")
          PYSCRIPT
          echo "inject_tuned.py written"

      - name: Run injection
        run: python3 inject_tuned.py

      - name: Verify injection
        run: |
          set -euo pipefail
          echo "=== three constants ==="
          grep -nE "LEFT_SHIFT_DP|ASSEMBLY_SHIFT_DP|GAP_TRIM_DP" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt | head -5 || echo "(none)"
          echo "=== value text marginEnd ==="
          grep -n "ASSEMBLY_SHIFT_DP \* density" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "(none)"
          echo "=== FINAL marginEnd ==="
          grep -n "valueTextWidth - gapTrimPx - inset" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "(none)"
          echo "=== no leftover old formula (expect 0) ==="
          grep -cE "else -\(inset \+ delta\)|TRACK_END_INSET_DP" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "0 (good)"

      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vftest-align-tuned
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14