name: Debug Build - Slider Right-End Gap Fix + Tracking

on:
  workflow_dispatch:
  push:
    branches:
      - QwenMirror

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repackage to com.vftest
        run: |
          set -euo pipefail
          sed -i 's/applicationId = "moe.echo.variablefonttest_n"/applicationId = "com.vftest"/' app/build.gradle.kts || {
            echo "ERROR: applicationId replacement failed" >&2
            exit 1
          }
          sed -i 's/android:label="@string\/app_name"/android:label="VFT-Debug"/' app/src/main/AndroidManifest.xml || {
            echo "ERROR: android:label replacement failed" >&2
            exit 1
          }
          grep -nE "applicationId" app/build.gradle.kts

      - name: Write injection script
        run: |
          cat > inject_gap_fix.py << 'PYSCRIPT'
          import io, sys

          path = "app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt"
          try:
              with io.open(path, "r", encoding="utf-8") as f:
                  src = f.read()
          except FileNotFoundError:
              print("ERROR: SliderPreference.kt not found", file=sys.stderr)
              sys.exit(1)

          def repl(old, new, label):
              global src
              if old not in src:
                  print("ERROR [" + label + "] pattern not found: " + repr(old[:70]))
                  sys.exit(1)
              src = src.replace(old, new, 1)
              print("OK [" + label + "]")

          # (1) 在 vt?.let 前声明 valueTextWidth（捕获数值区宽度 W）
          repl(
              "        vt?.let {",
              "        var valueTextWidth = 0\n        vt?.let {",
              "declare valueTextWidth",
          )

          # (2) 在宽度赋值处用 also 把 W 存进 valueTextWidth
          repl(
              'width = (tv.paint.measureText("1000") + paddingH + 2 * density).toInt()',
              'width = (tv.paint.measureText("1000") + paddingH + 2 * density).toInt().also { valueTextWidth = it }',
              "capture W",
          )

          # (3) 核心修正：非 wght 右端 marginEnd 由"负(向右顶)"改为"正(让出 W+δ 空隙)"
          repl(
              'lp.marginEnd = if (showLabel) -inset else -(inset + delta)',
              'lp.marginEnd = if (showLabel) -inset else (valueTextWidth + delta - inset)',
              "FIX marginEnd",
          )

          # (4) 跟踪日志（在 s.layoutParams = lp 后）
          repl(
              '                    s.layoutParams = lp',
              '                    s.layoutParams = lp\n'
              '                    android.util.Log.d("SLIDER_GAP", "showLabel=" + showLabel'
              ' + " insetDp=" + (inset / s.resources.displayMetrics.density)'
              ' + " Wdp=" + (valueTextWidth / s.resources.displayMetrics.density)'
              ' + " deltaDp=" + (delta / s.resources.displayMetrics.density)'
              ' + " mStartPx=" + lp.marginStart'
              ' + " mEndPx=" + lp.marginEnd'
              ' + " gapRightDp=" + ((lp.marginEnd + inset) / s.resources.displayMetrics.density))',
              "tracking log",
          )

          try:
              with io.open(path, "w", encoding="utf-8") as f:
                  f.write(src)
          except IOError as e:
              print(f"ERROR writing file: {e}", file=sys.stderr)
              sys.exit(1)

          print("DONE: gap fix + tracking injected")
          PYSCRIPT
          echo "inject_gap_fix.py written"

      - name: Run injection
        run: python3 inject_gap_fix.py

      - name: Verify injection
        run: |
          echo "=== corrected formula present ==="
          grep -n "valueTextWidth + delta - inset" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "(not found)"
          echo "=== tracking tag present ==="
          grep -c "SLIDER_GAP" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "0"
          echo "=== old buggy formula gone ==="
          grep -c "else -(inset + delta)" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "0 (good)"

      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vftest-gap-fix-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14