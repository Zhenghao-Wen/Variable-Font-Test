name: Debug Build - Slider Right-End Gap Fix v2

on:
  workflow_dispatch:
  push:
    branches:
      - QwenMirror

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repackage to com.vftest
        run: |
          set -euo pipefail
          sed -i 's/applicationId = "moe.echo.variablefonttest_n"/applicationId = "com.vftest"/' app/build.gradle.kts || {
            echo "ERROR: applicationId replacement failed" >&2
            exit 1
          }
          sed -i 's/android:label="@string\/app_name"/android:label="VFT-Debug"/' app/src/main/AndroidManifest.xml || {
            echo "ERROR: android:label replacement failed" >&2
            exit 1
          }

      - name: Write injection script
        run: |
          cat > inject_gap_fix.py << 'PYSCRIPT'
          import io, sys

          path = "app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt"
          try:
              with io.open(path, "r", encoding="utf-8") as f:
                  src = f.read()
          except IOError as e:
              print("ERROR reading file:", e, file=sys.stderr)
              sys.exit(1)

          def repl(old, new, label):
              global src
              if old not in src:
                  print("ERROR [" + label + "] not found: " + repr(old[:80]), file=sys.stderr)
                  sys.exit(1)
              src = src.replace(old, new, 1)
              print("OK [" + label + "]")

          # (1) 在 val delta 之后，用类属性 valueText 现算数值区宽度 W（避免局部变量跨 lambda 作用域问题）
          repl(
              "val delta = (TRACK_END_INSET_DP * s.resources.displayMetrics.density).toInt()",
              "val delta = (TRACK_END_INSET_DP * s.resources.displayMetrics.density).toInt()\n"
              "                val valueTextWidth = valueText?.let { tv -> (tv.paint.measureText(\"1000\") + (tv.paddingStart + tv.paddingEnd) + 2 * s.resources.displayMetrics.density).toInt() } ?: 0",
              "compute W via valueText",
          )

          # (2) 核心修正：非 wght 右端 marginEnd 取正（让出 W+δ 空隙），而非负值（向右顶）
          repl(
              "lp.marginEnd = if (showLabel) -inset else -(inset + delta)",
              "lp.marginEnd = if (showLabel) -inset else (valueTextWidth + delta - inset)",
              "FIX marginEnd sign",
          )

          # (3) 跟踪日志
          repl(
              "                    s.layoutParams = lp",
              "                    s.layoutParams = lp\n"
              "                    android.util.Log.d(\"SLIDER_GAP\", \"showLabel=\" + showLabel"
              " + \" insetDp=\" + (inset / s.resources.displayMetrics.density)"
              " + \" Wdp=\" + (valueTextWidth / s.resources.displayMetrics.density)"
              " + \" deltaDp=\" + (delta / s.resources.displayMetrics.density)"
              " + \" mStartPx=\" + lp.marginStart"
              " + \" mEndPx=\" + lp.marginEnd"
              " + \" gapRightDp=\" + ((lp.marginEnd + inset) / s.resources.displayMetrics.density))",
              "tracking log",
          )

          try:
              with io.open(path, "w", encoding="utf-8") as f:
                  f.write(src)
          except IOError as e:
              print("ERROR writing file:", e, file=sys.stderr)
              sys.exit(1)

          print("DONE: gap fix v2 injected")
          PYSCRIPT
          echo "inject_gap_fix.py written"

      - name: Run injection
        run: python3 inject_gap_fix.py

      - name: Verify injection
        run: |
          set -euo pipefail
          echo "=== W computed inside compensation block ==="
          grep -n "val valueTextWidth = valueText" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "(not found)"
          echo "=== corrected marginEnd formula ==="
          grep -n "valueTextWidth + delta - inset" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "(not found)"
          echo "=== old buggy formula gone (expect 0) ==="
          grep -c "else -(inset + delta)" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "0"
          echo "=== no stray local var declaration (expect 0) ==="
          grep -c "var valueTextWidth = 0" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt || echo "0"

      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vftest-gap-fix-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14