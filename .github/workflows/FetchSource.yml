name: Investigate Preference Divider Color

on:
  workflow_dispatch:
  push:
    branches:
      - QwenMirror

jobs:
  investigate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Build investigation report
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "❌ Error at line $LINENO (exit code $?)" >&2' ERR

          R="divider_investigation.txt"
          RES="app/src/main/res"
          JAVA="app/src/main/java"

          # 安全读取文件（若不存在则输出提示）
          safe_cat() {
            if [ -f "$1" ]; then
              cat "$1"
            else
              echo "[FILE NOT FOUND] $1"
            fi
          }

          {
            echo "# Preference Divider Color Investigation"
            echo "# Branch: dev"
            echo "# Commit: $(git rev-parse HEAD)"
            echo "# Date: $(date -u)"
            echo ""

            # ═══ A. 主题链路（Divider 颜色的最终来源）═══
            echo "## [A1] values/themes.xml"
            echo '```xml'
            safe_cat "$RES/values/themes.xml"
            echo '```'
            echo ""
            echo "## [A2] values-night/themes.xml"
            echo '```xml'
            safe_cat "$RES/values-night/themes.xml"
            echo '```'
            echo ""
            echo "## [A3] 是否存在 values-v31 / values-night-v31 主题"
            echo '```'
            ls -la "$RES/values-v31/" 2>/dev/null || echo "(no values-v31 dir)"
            ls -la "$RES/values-night-v31/" 2>/dev/null || echo "(no values-night-v31 dir)"
            echo '```'
            echo ""

            # ═══ B. 动态取色入口 ═══
            echo "## [B] MainActivity.kt（DynamicColors 应用情况）"
            echo '```kotlin'
            safe_cat "$JAVA/moe/echo/variablefonttest_n/MainActivity.kt"
            echo '```'
            echo ""

            # ═══ C. 全局检索 Divider / 取色关键字 ═══
            echo "## [C1] res/ 中 divider / colorOutline / listDivider 命中"
            echo '```'
            grep -rniE "divider|colorOutline|listDivider" "$RES" 2>/dev/null || echo "(no match in res/)"
            echo '```'
            echo ""
            echo "## [C2] java/ 中 Divider / ItemDecoration / colorOutline 命中"
            echo '```'
            grep -rniE "divider|ItemDecoration|colorOutline|setDivider" "$JAVA" 2>/dev/null || echo "(no match in java/)"
            echo '```'
            echo ""

            # ═══ D. OptionsFragment 中 RecyclerView / Divider 相关片段 ═══
            echo "## [D] OptionsFragment.kt 中 RecyclerView/listView/Divider 相关行"
            echo '```kotlin'
            grep -nE "RecyclerView|listView|Divider|ItemDecoration|onCreateRecyclerView|clipToPadding" \
              "$JAVA/moe/echo/variablefonttest_n/OptionsFragment.kt" 2>/dev/null || echo "(no match)"
            echo '```'
            echo ""

            # ═══ E. 两个自定义 Preference 的 divider 相关代码 ═══
            echo "## [E1] SliderPreference.kt（divider 相关）"
            echo '```kotlin'
            grep -nE "Divider|divider" "$JAVA/moe/echo/variablefonttest_n/SliderPreference.kt" 2>/dev/null || echo "(no divider code)"
            echo '```'
            echo ""
            echo "## [E2] SeekBarPreference.kt（divider 相关）"
            echo '```kotlin'
            grep -nE "Divider|divider" "$JAVA/moe/echo/variablefonttest_n/SeekBarPreference.kt" 2>/dev/null || echo "(no divider code)"
            echo '```'
            echo ""

            # ═══ F. 库版本（决定 PreferenceThemeOverlay 行为）═══
            echo "## [F1] app/build.gradle.kts"
            echo '```kotlin'
            safe_cat app/build.gradle.kts
            echo '```'
            echo ""
            echo "## [F2] gradle/libs.versions.toml"
            echo '```toml'
            safe_cat gradle/libs.versions.toml
            echo '```'
            echo ""

            # ═══ G. 颜色资源中是否定义 outline / divider 色 ═══
            echo "## [G] 各 colors.xml 中 outline/divider 相关定义"
            echo '```'
            for f in $(find "$RES" -name "colors.xml" | sort); do
              echo "--- $f ---"
              grep -niE "outline|divider" "$f" 2>/dev/null || echo "(none)"
            done
            echo '```'
            echo ""

            # ═══ H. Switch 控件布局（MD3 化参考）═══
            echo "## [H1] preference_widget_switch.xml"
            echo '```xml'
            safe_cat "$RES/layout/preference_widget_switch.xml"
            echo '```'
            echo ""
            echo "## [H2] preference_widget_switch_compat.xml"
            echo '```xml'
            safe_cat "$RES/layout/preference_widget_switch_compat.xml"
            echo '```'
            echo ""

            # ═══ I. Manifest（主题挂载确认）═══
            echo "## [I] AndroidManifest.xml"
            echo '```xml'
            safe_cat app/src/main/AndroidManifest.xml
            echo '```'
          } > "$R"

          SIZE=$(wc -c < "$R")
          echo "Report size: $SIZE bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: divider-investigation
          path: divider_investigation.txt
          retention-days: 14