name: Fetch Code - Slider Floating Label Feature

on:
  workflow_dispatch:
  push:
    branches:
      - QwenMirror

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Gather relevant code
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "❌ Error at line $LINENO (exit code $?)" >&2' ERR

          R="slider_label_feature.txt"
          RES="app/src/main/res"
          JAVA="app/src/main/java/moe/echo/variablefonttest_n"

          safe_cat() {
            if [ -f "$1" ]; then
              cat "$1"
            else
              echo "[FILE NOT FOUND] $1"
            fi
          }

          {
            echo "# Fetch for Slider Floating Label Feature"
            echo "# Commit: $(git rev-parse HEAD)"
            echo "# Date: $(date -u)"
            echo ""

            echo "## [1] res/menu/main_menu.xml"
            echo '```xml'
            safe_cat "$RES/menu/main_menu.xml"
            echo '```'
            echo ""

            echo "## [2] Constants.kt"
            echo '```kotlin'
            safe_cat "$JAVA/Constants.kt"
            echo '```'
            echo ""

            echo "## [3] MainActivity.kt"
            echo '```kotlin'
            safe_cat "$JAVA/MainActivity.kt"
            echo '```'
            echo ""

            echo "## [4] SliderPreference.kt"
            echo '```kotlin'
            safe_cat "$JAVA/SliderPreference.kt"
            echo '```'
            echo ""

            echo "## [5] res/layout/preference_widget_slider.xml"
            echo '```xml'
            safe_cat "$RES/layout/preference_widget_slider.xml"
            echo '```'
            echo ""

            echo "## [6] values/strings.xml (full)"
            echo '```xml'
            safe_cat "$RES/values/strings.xml"
            echo '```'
            echo ""

            echo "## [7] values-zh-rCN/strings.xml (full)"
            echo '```xml'
            safe_cat "$RES/values-zh-rCN/strings.xml"
            echo '```'
            echo ""

            echo "## [8] All locale string files present"
            echo '```'
            find "$RES" -name "strings.xml" | sort
            echo '```'
            echo ""

            echo "## [9] OptionsFragment.kt (full)"
            echo '```kotlin'
            safe_cat "$JAVA/OptionsFragment.kt"
            echo '```'
            echo ""

            echo "## [10] grep: label / formatter / showLabel usages"
            echo '```'
            grep -rnE "showLabel|labelBehavior|setLabelFormatter|LabelFormatter|formatter" "$JAVA" 2>/dev/null || echo "(none)"
            echo '```'
            echo ""

            echo "## [11] grep: toFeatures / variation text-mode formatting"
            echo '```'
            grep -rnE "toFeatures|fontVariationSettings\[|VARIATION_AXIS|/ 10|- 90" "$JAVA/OptionsFragment.kt" 2>/dev/null || echo "(none)"
            echo '```'
          } > "$R"

          echo "Report size: $(wc -c < "$R") bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: slider-label-feature-code
          path: slider_label_feature.txt
          retention-days: 7