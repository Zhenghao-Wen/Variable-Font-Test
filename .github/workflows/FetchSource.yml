name: Build Debug Measure APK v2 (thumbRadius)

on:
  workflow_dispatch:
  push:
    branches:
      - QwenMirror

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repackage to com.vftest (applicationId only)
        run: |
          sed -i 's/applicationId = "moe.echo.variablefonttest_n"/applicationId = "com.vftest"/' app/build.gradle.kts
          grep -nE "applicationId|namespace" app/build.gradle.kts

      - name: Set distinct debug label
        run: |
          sed -i 's/android:label="@string\/app_name"/android:label="VFT-Debug"/' app/src/main/AndroidManifest.xml
          grep -n "android:label" app/src/main/AndroidManifest.xml

      - name: Inject MEASURE instrumentation (thumbRadius + widths)
        run: |
          python3 << 'PYEOF'
          import io

          def inject(path, anchor, block):
              with io.open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              idx = None
              for i, line in enumerate(lines):
                  if anchor in line:
                      idx = i
                      break
              if idx is None:
                  raise SystemExit("ERROR: anchor '%s' not found in %s" % (anchor, path))
              lines.insert(idx + 1, block)
              with io.open(path, "w", encoding="utf-8") as f:
                  f.writelines(lines)
              print("OK: injected after line %d in %s" % (idx + 1, path))

          slider_block = '''        // == MEASURE v2 (CI injected) ==
          run {
              val density = s.resources.displayMetrics.density
              vt?.let { tv ->
                  tv.fontFeatureSettings = "tnum"
                  android.util.Log.d("MEASURE", "[MD3] '1000'(tnum)width=${"%.2f".format(tv.paint.measureText("1000") / density)}dp, '0'=${"%.2f".format(tv.paint.measureText("0") / density)}dp")
                  tv.post {
                      android.util.Log.d("MEASURE", "[MD3] slider_value viewWidth=${"%.2f".format(tv.width / density)}dp, paddingH=${"%.2f".format((tv.paddingStart + tv.paddingEnd) / density)}dp")
                  }
              }
              try {
                  val baseCls = com.google.android.material.slider.BaseSlider::class.java
                  android.util.Log.d("MEASURE", "[MD3] BaseSlider fields=" + baseCls.declaredFields.joinToString(",") { it.name })
                  val f = baseCls.getDeclaredField("thumbRadius")
                  f.isAccessible = true
                  android.util.Log.d("MEASURE", "[MD3] thumbRadius=${"%.2f".format(f.getInt(s) / density)}dp (${f.getInt(s)}px)")
              } catch (e: Exception) {
                  android.util.Log.d("MEASURE", "[MD3] thumbRadius reflect fail: " + e.message)
              }
              for (fname in listOf("trackSidePadding", "labelPadding", "trackHeight", "separatorWidth")) {
                  try {
                      val ff = com.google.android.material.slider.BaseSlider::class.java.getDeclaredField(fname)
                      ff.isAccessible = true
                      android.util.Log.d("MEASURE", "[MD3] $fname=${ff.getInt(s)}px=${"%.2f".format(ff.getInt(s) / density)}dp")
                  } catch (e: Exception) { }
              }
          }
          // == MEASURE v2 end ==
          '''

          seekbar_block = '''        // == MEASURE v2 (CI injected) ==
          run {
              val density = seekBar.resources.displayMetrics.density
              (view.findViewById(androidx.preference.R.id.seekbar_value) as? android.widget.TextView)?.let { tv ->
                  tv.fontFeatureSettings = "tnum"
                  android.util.Log.d("MEASURE", "[MD2] '1000'(tnum)width=${"%.2f".format(tv.paint.measureText("1000") / density)}dp, '0'=${"%.2f".format(tv.paint.measureText("0") / density)}dp")
                  tv.post {
                      android.util.Log.d("MEASURE", "[MD2] seekbar_value viewWidth=${"%.2f".format(tv.width / density)}dp, paddingH=${"%.2f".format((tv.paddingStart + tv.paddingEnd) / density)}dp")
                  }
              }
          }
          // == MEASURE v2 end ==
          '''

          inject(
              "app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt",
              "findViewById(R.id.slider_value)",
              slider_block,
          )
          inject(
              "app/src/main/java/moe/echo/variablefonttest_n/SeekBarPreference.kt",
              "thumbTintList = primaryColorStateList",
              seekbar_block,
          )
          PYEOF

      - name: Verify injection
        run: |
          echo "=== SliderPreference MEASURE count ==="
          grep -c "MEASURE" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt
          echo "=== SeekBarPreference MEASURE count ==="
          grep -c "MEASURE" app/src/main/java/moe/echo/variablefonttest_n/SeekBarPreference.kt
          echo "=== thumbRadius probe present ==="
          grep -c "thumbRadius" app/src/main/java/moe/echo/variablefonttest_n/SliderPreference.kt

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug --no-daemon

      - name: Locate APK
        run: |
          ls -la app/build/outputs/apk/debug/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vftest-debug-measure-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14